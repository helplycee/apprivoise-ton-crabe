<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dégonfle ton stress</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chango&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout : une grande plage en cases de BD. Chaque idée tient dans une image, le détail se déplie à part. */
:root{
  color-scheme:light;
  /* Layout : sous l'eau. Les étapes sont des bulles qui remontent, le titre est gonflé comme le poisson. */
  --sky:#9FE6EE; --sky-2:#D6F8F7; --sand:#FFE08A; --sand-2:#F4FFFE; --ink:#07305A; --ink-2:#2B5277;
  --coral:#D93A6A; --sea:#0A6C94; --mint:#BDF2D8; --lilac:#FFE9A8; --paper:#FFFFFF; --line:#0A4B7A;
  --cloud:#FFFFFF; --sun:#FFFFFF; --wave:#26C2C9; --on-coral:#FFFFFF; --on-sea:#FFFFFF;
  --crab:#FFD23F; --crab-dark:#B67A00; --good:#0A6F52; --bad:#B02556; --good-bg:#D5F7E7; --bad-bg:#FFE1EC;
  --display:"Chango","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Atkinson Hyperlegible","Trebuchet MS",Verdana,sans-serif;
}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{background:var(--sky-2);color:var(--ink);font:400 1.125rem/1.55 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
.wrap{max-width:780px;margin-inline:auto;min-width:0}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.08;text-wrap:balance;margin:0}
h1{font-size:clamp(3rem,13vw,5.4rem)} h2{font-size:clamp(1.8rem,6vw,2.5rem)} h3{font-size:1.3rem}
p{margin:0} a{color:inherit;text-underline-offset:3px;text-decoration-thickness:2px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px;border-radius:6px}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.stack-l{display:flex;flex-direction:column;gap:30px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--coral);color:var(--on-coral);border:2px solid var(--line);border-radius:999px;padding:13px 24px;font-weight:700;box-shadow:0 4px 0 var(--line);text-align:center;transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 0 var(--line)} .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.alt{background:var(--paper);color:var(--ink)} .btn.sea{background:var(--sea);color:var(--on-sea)}
.tag{font-weight:700;font-size:.82rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.hero{background:var(--sky);margin-inline:calc(50% - 50vw);padding-block:32px 0;overflow:hidden}
.hero>.wrap,.check>.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:12px;align-items:end;position:relative;z-index:1}
.hero-txt{display:flex;flex-direction:column;gap:12px;padding-bottom:24px;min-width:0}
.lede{font-size:1.25rem;line-height:1.4;max-width:30em}
.hero-scene{width:100%;display:block;margin-bottom:-30px}
.beach{display:block;width:100%;height:56px;margin-top:-1px}.beach path{fill:var(--sand)}
.check{background:var(--sand);margin-inline:calc(50% - 50vw);padding-block:6px 36px}
.check-grid{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:20px;align-items:center}
.crab-box{height:170px;display:flex;align-items:flex-end;justify-content:center}
.crab-box svg{width:190px;max-width:100%;transform-origin:50% 100%;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.crab-body{fill:var(--crab)} .crab-claw{fill:var(--crab);stroke:var(--crab-dark);stroke-width:3}
.crab-leg{stroke:var(--crab-dark);stroke-width:6;stroke-linecap:round;fill:none}
.crab-eye{fill:#fff;stroke:#14235E;stroke-width:3}.crab-pupil{fill:#14235E}.crab-mouth{stroke:#14235E;stroke-width:4;fill:none;stroke-linecap:round}
input[type=range]{width:100%;accent-color:var(--coral);height:32px}
.scale{display:flex;justify-content:space-between;font-size:.9rem;font-weight:700}
.big-num{font:400 1.5rem/1 var(--display)}
.alertbox{background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px}
.path{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.stop{width:100%;height:100%;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:0;overflow:hidden;display:flex;flex-direction:column}
.stop:hover{background:var(--sand-2)}
.stop svg{display:block;width:100%;height:auto;border-bottom:2px solid var(--line)}
.stop-body{padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.stop small{color:var(--ink-2);font-size:.98rem;line-height:1.3}
.state{align-self:flex-start;font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:999px;border:2px solid var(--line);margin-top:4px}
.stop.done .state{background:var(--sea);color:var(--on-sea)}
.shells{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.shell{width:32px;height:32px}.shell path{fill:none;stroke:var(--line);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.shell .fill{fill:transparent}.shell.on .fill{fill:var(--coral)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:16px;flex-wrap:wrap}
.linkbtn{background:none;border:0;padding:6px 0;font-weight:700;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.step-head{display:flex;flex-direction:column;gap:8px;padding-bottom:12px}
.scene{display:block;width:100%;height:auto;border:2px solid var(--line);border-radius:18px}
.prose{display:flex;flex-direction:column;gap:10px;max-width:60ch}
.comic{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.panel{background:var(--paper);border:2px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.panel svg{display:block;width:100%;height:auto;background:var(--sky)}
.panel p{padding:9px 11px;font-size:1rem;line-height:1.3;border-top:2px solid var(--line)}
.more{background:var(--lilac);border:2px solid var(--line);border-radius:14px}
.more summary{cursor:pointer;font-weight:700;padding:12px 14px;display:flex;gap:10px;align-items:center;list-style:none}
.more summary::-webkit-details-marker{display:none}
.more summary::before{content:"+";width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--paper);border:2px solid var(--line);font-weight:700}
.more[open] summary::before{content:"–"}
.more>div{padding:0 14px 14px;display:flex;flex-direction:column;gap:9px}
.mores{display:flex;flex-direction:column;gap:8px}
.kind{font-weight:700;font-size:.82rem;letter-spacing:.09em;text-transform:uppercase;color:var(--sea)}
.res{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr))}
.res a{display:flex;flex-direction:column;gap:3px;padding:13px 15px;background:var(--paper);border:2px solid var(--line);border-radius:14px;text-decoration:none}
.res a:hover{background:var(--sand-2)}
.res b{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.res span{font-size:.95rem;color:var(--ink-2);line-height:1.3}
.res em{font-style:normal;font-weight:700;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--sea)}
.res em svg{width:13px;height:13px;vertical-align:-1px;margin-right:5px;fill:currentColor}
.game{background:var(--sand-2);border:2px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.q{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:13px;display:flex;flex-direction:column;gap:9px}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{background:var(--sky-2);border:2px solid var(--line);border-radius:999px;padding:8px 15px;font-weight:700;font-size:1rem;color:var(--ink)}
.choice:hover:not([disabled]){background:var(--sand)}
.choice.long{border-radius:14px;text-align:left}
.choice.ok{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.choice.ko{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.fb{font-size:1rem;line-height:1.35}
.score{font:400 1.15rem/1.2 var(--display)}
.body-map{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:16px;align-items:center}
.figure{position:relative;width:100%;max-width:230px;margin-inline:auto}
.figure svg{display:block;width:100%;height:auto}
.hot{position:absolute;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:var(--coral);color:#fff;border:3px solid var(--line);font-weight:700;display:grid;place-items:center;padding:0}
.hot.seen{background:var(--sea)} .hot[aria-pressed=true]{outline:4px solid var(--sun);outline-offset:1px}
.body-txt{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:14px;min-height:130px;display:flex;flex-direction:column;gap:5px}
.body-txt b{font:400 1.25rem/1.15 var(--display)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:9px}
.card-pick{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;font-weight:700;font-size:.98rem;line-height:1.2;color:var(--ink)}
.card-pick svg{width:56px;height:56px}
.card-pick[aria-pressed=true]{background:var(--sand);box-shadow:inset 0 0 0 2px var(--line)}
.tips{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.tips li{background:var(--paper);border:2px dashed var(--line);border-radius:12px;padding:10px 13px}
.tips li.warn{background:var(--bad-bg);border-style:solid;border-color:var(--bad)}
.piles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pile{border:2px solid var(--line);border-radius:14px;padding:11px;display:flex;flex-direction:column;gap:7px;min-height:110px;min-width:0}
.pile.me{background:var(--sand)} .pile.no{background:var(--wave)}
.pile b{font:400 1.05rem/1.15 var(--display)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:2px 9px;font-size:.86rem;font-weight:700}
.ingredients{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ingredients div{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:9px;min-width:0}
.ingredients b{display:block;color:var(--coral);font:400 1.5rem/1 var(--display)}
.lung{display:flex;flex-direction:column;align-items:center;gap:13px}
.bubble-zone{width:min(100%,250px);aspect-ratio:1;display:grid;place-items:center;background:var(--paper);border:2px solid var(--line);border-radius:50%;overflow:hidden}
.bubble{grid-area:1/1;width:100%;height:100%;border-radius:50%;background:var(--wave);transform:scale(.55);transition:transform 5s ease-in-out}
.bubble-txt{grid-area:1/1;z-index:1;font:400 1.45rem/1 var(--display);background:var(--paper);padding:8px 14px;border-radius:999px;border:2px solid var(--line);text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.pill[aria-pressed=true]{background:var(--sand)}
.senses{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
.sense{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:7px 3px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:700;color:var(--ink);font-size:.92rem;line-height:1.1;min-width:0}
.sense b{font:400 1.6rem/1 var(--display);color:var(--coral)}
.sense.on{background:var(--mint)}
.guide{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:14px;text-align:center;font:400 1.35rem/1.2 var(--display);min-height:70px;display:grid;place-items:center}
.traps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.traps div{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-size:.92rem;line-height:1.2;min-width:0}
.traps svg{width:100%;max-width:90px;display:block;margin:0 auto 3px}
.traps b{display:block}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:10px 12px}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:700}
.note{font-size:.95rem;color:var(--ink-2);line-height:1.4}
.stickers{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px}
.mycard{background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:9px;box-shadow:6px 6px 0 var(--coral);position:relative;overflow:hidden}
.mycard svg.c{position:absolute;right:8px;top:8px;width:74px}
.mycard h3{padding-right:80px}.mycard dl{margin:0;display:flex;flex-direction:column;gap:8px}
.mycard dt{font-weight:700;font-size:.82rem;letter-spacing:.07em;text-transform:uppercase;color:var(--sea)}.mycard dd{margin:0;overflow-wrap:anywhere}
.finish{background:var(--sea);color:var(--on-sea);border:2px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:11px}
.finish .btn{align-self:flex-start;background:var(--sand);color:#14235E}
.helpbtn{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:#fff;border:2px solid var(--line);border-radius:999px;padding:10px 18px;font-weight:700;box-shadow:0 4px 12px rgba(10,20,60,.28)}
.help{background:var(--paper);border:3px solid var(--coral);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:11px}
.help ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.tel{font-weight:700;user-select:all;white-space:nowrap}
footer{padding-top:26px;display:flex;flex-direction:column;gap:10px;font-size:.92rem;color:var(--ink-2)}
footer ul{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.a-float{animation:floaty 3.5s ease-in-out infinite}.a-wave{animation:wave 7s linear infinite}
@keyframes floaty{50%{transform:translateY(-6px)}}@keyframes wave{to{transform:translateX(-200px)}}
@media (max-width:640px){
  .hero-grid{grid-template-columns:minmax(0,1fr)}.hero-txt{padding-bottom:0}.hero-scene{max-width:240px;justify-self:end;margin-top:-8px}
  .check-grid{grid-template-columns:minmax(0,1fr)}.crab-box{order:-1;height:140px}.crab-box svg{width:160px}
  .body-map{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:440px){.piles,.ingredients{grid-template-columns:minmax(0,1fr)}.traps{grid-template-columns:minmax(0,1fr)}.senses{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

html,body{background:#D6F8F7}
.finish .pearl{stroke:#fff}
h1{font-size:clamp(2rem,8.4vw,3.1rem);line-height:1.08}
h2{font-size:clamp(1.5rem,5.2vw,2.15rem)}h3{font-size:1.02rem;line-height:1.15}
.hero{background:radial-gradient(circle at 80% 30%,#D6F8F7 0,#9FE6EE 60%,#7FD9E6 100%);padding-block:34px 30px}
.puff{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px 22px;align-items:center}
.puff-txt{display:flex;flex-direction:column;gap:12px;min-width:0}
.puff-ctl{grid-column:1/-1;background:rgba(255,255,255,.72);border:2px solid var(--line);border-radius:30px;padding:18px;display:flex;flex-direction:column;gap:10px}
.crab-box{height:auto;min-height:220px;align-items:center}
.crab-box svg{transform:none!important;width:100%;max-width:330px}
.path{display:flex;flex-wrap:wrap;justify-content:center;gap:16px}
.path li{width:calc(33.33% - 11px)}
.stop{aspect-ratio:1;border-radius:50%;border:3px solid var(--line);position:relative;background:rgba(255,255,255,.9);justify-content:center;align-items:center;text-align:center}
.stop svg{position:absolute;inset:0;width:100%;height:52%;border-bottom:0}
.stop-body{position:absolute;left:8%;right:8%;top:53%;align-items:center;padding:0;gap:3px}
.state{align-self:center}
.game,.help,.finish,.scene,.panel,.more,.res a,.q,.body-txt{border-radius:26px}
.game{border-width:3px}
.help{border-color:var(--coral)}
.bubble-zone{background:#D6F8F7;position:relative}
.bubble{background:none;border-radius:0;display:grid;place-items:center;transform:scale(.55);transform-origin:center}
.bubble svg{width:100%;height:auto;overflow:visible}
.bubble-txt{align-self:end;margin-bottom:10px;font-size:1.05rem}
.big-num{font-size:1.25rem}
.score{font-size:1rem}.body-txt b,.pile b{font-size:1rem}.bubble-txt,.guide{font-size:1.05rem;line-height:1.3}
.ingredients b{font-size:1.25rem}
.shell{width:30px;height:30px}
@media (max-width:640px){
 .puff{grid-template-columns:minmax(0,1fr)}.crab-box{min-height:170px;order:0}.crab-box svg{max-width:240px}
 .path{gap:10px}.path li{width:calc(50% - 5px)}
 h3{font-size:.86rem}.state{font-size:.72rem}
}

</style>
</head>
<body>
<main id="app" class="wrap"></main>
<button class="helpbtn" id="helpbtn" type="button">Besoin de parler ?</button>
<script>
(function(){
var KEY='degonfle-ton-stress-v5';
var S={before:5,after:null,done:{},game:{},seen:{},picks:{},mine:'',stick:{},k1:'',k2:'',k3:'',round:{}};
try{var sv=JSON.parse(localStorage.getItem(KEY));if(sv)S=Object.assign(S,sv)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var app=document.getElementById('app');
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

 'etape-1':function(){return head(0)+'<div class="stack-l"><section class="stack"><h2>L’histoire en 4 images</h2>'+comic()+'</section>'+
 '<section class="prose"><p>Le stress, c’est une alarme dans ton corps. Elle sonne quand quelque chose est important ou fait peur. Autrefois, elle servait à fuir les animaux dangereux. Aujourd’hui, elle sonne aussi pour un contrôle.</p></section>'+
 '<section class="game"><h2>Où ça se passe dans mon corps ?</h2><div class="body-map"><div class="figure">'+figure()+BODY.map(function(b){return '<button type="button" class="hot'+(S.seen[b.k]?' seen':'')+'" data-body="'+b.k+'" aria-pressed="false" aria-label="'+b.t+'" style="left:'+b.x+'%;top:'+b.y+'%">'+b.n+'</button>'}).join('')+'</div><div class="body-txt" id="body-txt" aria-live="polite">'+bodyView()+'</div></div></section>'+
 '<section class="stack"><p class="kind">Pour mieux comprendre</p><div class="mores">'+
 more('Bon stress ou mauvais stress ?','<p>Un peu de stress te réveille et t’aide à te concentrer. Le stress devient un problème quand il est trop fort ou quand il ne part plus.</p><p>Exemple : avoir le trac cinq minutes avant un oral, c’est normal. Avoir mal au ventre tous les matins pendant des semaines, il faut en parler.</p>')+
 more('C’est quoi l’adrénaline et le cortisol ?','<p>Ce sont des hormones, des messagers qui voyagent dans le sang.</p><p><b>L’adrénaline</b> arrive très vite. Elle accélère le cœur et la respiration.</p><p><b>Le cortisol</b> arrive juste après. Il donne de l’énergie au corps. C’est de lui que vient le nom de Corti.</p>')+
 more('Stress ou anxiété, c’est pareil ?','<p>Pas tout à fait. Le stress répond souvent à quelque chose de précis, comme un contrôle. L’anxiété, c’est de s’inquiéter beaucoup, parfois sans savoir pourquoi, et ça peut durer. Si elle prend trop de place, un professionnel peut aider.</p>')+
 '</div></section><section class="stack"><p class="kind">Regarder, écouter, lire</p><div class="res">'+
 res('Vidéo · 5 min 37',YT+'eXg5YZ1Vhh4','Surfe ton stress, épisode 1','Une série québécoise faite pour les ados.')+
 res('Podcast · 6 min',OK+'la-pression-scolaire-ca-fait-mal','La pression scolaire… ça fait mal !','Des collégiens en parlent dans Ma vie d’ado, le podcast du magazine Okapi.')+
 res('Vidéo · 3 min','https://www.lumni.fr/video/stress-comment-le-maitriser','Stress : comment le maîtriser ?','Le docteur Jimmy Mohamed l’explique sur Lumni, pour les collégiens.')+
 '</div></section><section class="game"><h2>Vrai ou faux ?</h2>'+quiz('q1',cur('q1'))+'</section>'+finish(0)+'</div>'},
 'etape-2':function(){return head(1)+'<div class="stack-l"><section class="prose"><p>Ce qui stresse une personne ne stresse pas forcément une autre. Il n’y a pas de bonne ou de mauvaise raison.</p></section>'+
 '<section class="game"><h2>Et toi, qu’est-ce qui te stresse ?</h2><div class="cards">'+CARDS.map(function(c){return '<button type="button" class="card-pick" data-pick="'+c.k+'" aria-pressed="'+(S.picks[c.k]?'true':'false')+'">'+icon(c)+c.t+'</button>'}).join('')+'</div><div id="tips" aria-live="polite">'+tips()+'</div><label class="f" for="mine">Autre chose ? (facultatif)<input type="text" id="mine" maxlength="100" value="'+esc(S.mine)+'"></label></section>'+
 '<section class="game"><h2>Ça dépend de moi ?</h2><p>On se fatigue à penser à ce qu’on ne peut pas changer. Ce tri t’aide à voir où agir.</p>'+quiz('q2',cur('q2'))+'<div class="piles" id="piles">'+piles()+'</div></section>'+
 '<section class="stack"><p class="kind">Pour mieux comprendre</p><div class="mores">'+
 more('La recette du stress : les 4 ingrédients','<p>La chercheuse Sonia Lupien a repéré 4 ingrédients. Plus il y en a, plus le stress monte.</p><div class="ingredients"><div><b>C</b>Je n’ai pas le <strong>contrôle</strong>. Exemple : attendre une note.</div><div><b>I</b>C’est <strong>imprévu</strong>. Exemple : une interro surprise.</div><div><b>N</b>C’est <strong>nouveau</strong>. Exemple : le premier jour au collège.</div><div><b>É</b>Mon <strong>égo</strong>, l’image que j’ai de moi, est touché. Exemple : j’ai peur qu’on se moque.</div></div>')+
 more('Stress normal ou harcèlement ?','<p>Le harcèlement, ce sont des moqueries, des insultes, des coups ou des messages qui se répètent contre quelqu’un.</p><p>Ce n’est pas un stress à gérer seul ou seule, et ce n’est jamais la faute de la victime. Il faut en parler à un adulte. Le 3018 peut aussi t’aider.</p>')+
 '</div></section><section class="stack"><p class="kind">Regarder et écouter</p><div class="res">'+
 res('Vidéo · 4 min 26',YT+'bhFjJv1XRRY','Surfe ton stress, épisode 2','La suite de la série.')+
 res('Podcast · 4 min',OK+'la-pire-note-de-ma-vie','La pire note de ma vie','Une collégienne raconte son zéro.')+
 res('Vidéo · 2 min 33','https://www.lumni.fr/video/gerer-son-stress','Gérer son stress avant un contrôle','Des astuces rapides sur Lumni, série TakTik Collège.')+
 res('Vidéo · 3 min 22','https://www.lumni.fr/video/l-oral-du-brevet','L’oral du brevet','Des élèves racontent comment ça se passe, sur Lumni.')+
 '</div></section>'+finish(1)+'</div>'},
 'etape-3':function(){return head(2)+'<div class="stack-l"><section class="prose"><p>Quand tu stresses, ta tête va vite. Ton corps peut l’aider à ralentir. Essaie maintenant, même si tu es calme. Comme au sport, ça marche mieux avec de l’entraînement.</p></section>'+
 '<section class="game"><h2>1. Gonfle, dégonfle</h2><p>Inspire quand Corti gonfle. Souffle quand il se dégonfle. Si la tête te tourne, arrête et respire normalement.</p><div class="lung"><div class="bubble-zone"><div class="bubble" id="bubble"><svg viewBox="0 0 200 130" aria-hidden="true">'+crabMini(0,0,1,20)+'</svg></div><div class="bubble-txt" id="btxt" aria-live="polite">Prêt ?</div></div><div class="row"><button type="button" class="choice pill" data-dur="1" aria-pressed="true">1 min</button><button type="button" class="choice pill" data-dur="2" aria-pressed="false">2 min</button><button type="button" class="choice pill" data-dur="3" aria-pressed="false">3 min</button></div><button type="button" class="btn sea" id="bstart">Lancer Corti</button></div></section>'+
 '<section class="game"><h2>2. Serre, relâche</h2><p>Serre fort une partie du corps, puis lâche tout. Ne te fais pas mal.</p><div class="guide" id="guide" aria-live="polite">Prêt ?</div><div><button type="button" class="btn sea" id="gstart">Commencer</button></div></section>'+
 '<section class="game"><h2>3. Le jeu des 5 sens</h2><p>Idéal en classe : personne ne le voit. Clique sur chaque case quand c’est fait.</p><div class="senses">'+[['5','choses que je vois'],['4','choses que je touche'],['3','bruits que j’entends'],['2','odeurs que je sens'],['1','grande inspiration']].map(function(s){return '<button type="button" class="sense" data-sense><b>'+s[0]+'</b>'+s[1]+'</button>'}).join('')+'</div></section>'+
 '<section class="stack"><p class="kind">Pour mieux comprendre</p><div class="mores">'+
 more('Pourquoi respirer calme ?','<p>Souffler lentement envoie un message à ton corps : « Pas de danger pour l’instant. » Beaucoup de gens se sentent mieux après. Les scientifiques étudient encore cet effet, alors teste et garde ce geste s’il t’aide.</p>')+
 more('Et si ça ne marche pas ?','<p>Ce n’est pas grave et ce n’est pas ta faute. Essaie un autre geste. Bouger, marcher ou parler à quelqu’un marche aussi très bien.</p>')+
 '</div></section><section class="stack"><p class="kind">Regarder et lire</p><div class="res">'+
 res('Vidéo · 3 min','https://player.vimeo.com/video/913624598','Le bouton d’urgence','Un exercice de respiration en images, du CHUV de Lausanne.')+
 res('Vidéo · 6 min',YT+'CfJBDS2uXCc','Surfe ton stress, épisode 3','La suite de la série.')+
 res('Lecture · 2 min','https://www.feel-ok.ch/fr_CH/ecole/sujets/stress/a-savoir/se_detendre/exercices/bienfaits_de_la_detente.cfm','Pourquoi se détendre ?','Une page courte et illustrée du site suisse feel-ok, pour les jeunes.')+
 '</div></section>'+finish(2)+'</div>'},
 'etape-4':function(){function tr(t,d,c){return '<div><svg viewBox="0 0 90 70" aria-hidden="true"><path d="M8 62 C8 18 24 6 45 6 C66 6 82 18 82 62 L68 54 L56 62 L45 54 L34 62 L22 54Z" fill="'+c+'" '+ST+'/><circle cx="33" cy="30" r="6" fill="#fff" '+ST+'/><circle cx="57" cy="30" r="6" fill="#fff" '+ST+'/></svg><b>'+t+'</b>'+d+'</div>'}
 return head(3)+'<div class="stack-l"><section class="prose"><p>Quand on stresse, notre tête invente parfois des phrases qui exagèrent. On les appelle ici des pensées pièges. Tout le monde en a !</p></section>'+
 '<section class="stack"><h2>Les 3 monstres pièges</h2><div class="traps">'+tr('Le grand drame','Il imagine toujours le pire.','var(--crab)')+tr('Le toujours-jamais','Il dit « toujours », « jamais », « tout le monde ».','var(--wave)')+tr('Le lecteur de pensées','Il croit savoir ce que pensent les autres.','var(--lilac)')+'</div></section>'+
 '<section class="game"><h2>Quel monstre parle ?</h2>'+quiz('q4',cur('q4'))+'</section><section class="game"><h2>Que dirais-tu à un ami ?</h2><p>On est souvent plus gentil avec ses amis qu’avec soi-même.</p>'+quiz('q5',cur('q5'),true)+'</section>'+
 '<section class="stack"><p class="kind">Pour mieux comprendre</p><div class="mores">'+
 more('Est-ce que je dois penser positif ?','<p>Non. Se dire « tout va être parfait », ce n’est pas toujours vrai. Une bonne réponse est juste vraie et gentille : « C’est dur, mais j’ai déjà réussi des choses difficiles. »</p>')+
 more('Pourquoi le regard des autres compte tant ?','<p>À l’adolescence, ton cerveau change beaucoup. Il est très attentif aux autres et aux relations. C’est normal d’y penser souvent. Ton cerveau continue à se transformer jusque vers 20 ans.</p>')+
 '</div></section><section class="stack"><p class="kind">Lire</p><div class="res">'+
 res('Lecture · 4 min','https://www.feel-ok.ch/stress-pro5-fr/','Tes attentes et ton stress','Comment répondre aux pensées qui font peur, sur le site suisse feel-ok.')+
 '</div></section>'+finish(3)+'</div>'},
 'etape-5':function(){var v=S.after==null?S.before:S.after;return head(4)+'<div class="stack-l"><section class="prose"><p>Tu as essayé plusieurs idées. Toutes ne marchent pas pour tout le monde. Choisis tes préférées et mets-les dans ta boîte à calme.</p></section>'+
 '<section class="game"><h2>Remplis ta boîte</h2><p>Choisis-en 2 ou 3.</p><div class="stickers">'+STK.map(function(k){return '<button type="button" class="card-pick" data-stick="'+esc(k)+'" aria-pressed="'+(S.stick[k]?'true':'false')+'">'+k+'</button>'}).join('')+'</div>'+
 '<label class="f" for="k2">Ma phrase pour me donner du courage<input type="text" id="k2" maxlength="100" placeholder="Exemple : j’ai déjà réussi des choses difficiles" value="'+esc(S.k2)+'"></label><label class="f" for="k3">Mon adulte de confiance<input type="text" id="k3" maxlength="60" placeholder="Un prénom ou un rôle" value="'+esc(S.k3)+'"></label></section>'+
 '<section class="stack"><h2>Ma carte à garder</h2><div class="mycard" id="card"></div><div class="row" style="justify-content:flex-start"><button type="button" class="btn alt" id="copy">Copier ma carte</button><span class="note" id="copied" aria-live="polite"></span></div></section>'+
 '<section class="stack"><p class="kind">Pour mieux comprendre</p><div class="mores">'+
 more('Pourquoi le sommeil et le sport aident ?','<p>Quand tu dors bien, tu es plus calme et tu retiens mieux. Bouger aide ton corps à évacuer la tension. Pas besoin d’être champion : une marche, ça compte.</p>')+
 more('À qui parler, et comment commencer ?','<p>Tu peux dire simplement : « Je ne me sens pas bien en ce moment, est-ce que je peux te parler ? » Si la première personne ne t’écoute pas, essaie-en une autre.</p>')+
 '</div></section><section class="stack"><p class="kind">Regarder et écouter</p><div class="res">'+
 res('Podcast · 6 min',OK+'prendre-soin-de-moi-facile','Prendre soin de moi ? Facile !','Dormir, bouger, voir les autres : comment recharger ses batteries.')+
 res('Vidéo · 4 min 30',YT+'ucC8HuOcDmE','Surfe ton stress, épisode 4','La fin de la série.')+
 res('Vidéo · 3 min 15','https://www.lumni.fr/video/c-est-quoi-une-crise-d-angoisse','C’est quoi une crise d’angoisse ?','Une psychologue répond, sur Lumni.')+
 res('Lecture','https://www.solidarites.gouv.fr/agressions-cyberharcelement-violences-si-tu-besoin-daide-des-numeros-existent','Si tu as besoin d’aide','Les numéros à connaître, expliqués aux jeunes.')+
 '</div></section><section class="game"><h2>Et Corti, maintenant ?</h2><div class="crab-box" id="box-after">'+crabSVG(v)+'</div><label for="s-after" class="big-num" id="v-after">'+v+' / 10</label><input type="range" id="s-after" min="0" max="10" value="'+v+'"><div class="scale"><span>Tout plat</span><span>Gonflé à bloc</span></div><p id="compare" aria-live="polite">'+compare()+'</p></section>'+finish(4)+'</div>'}
};
function compare(){if(S.after==null)return 'Déplace le curseur.';var d=S.before-S.after;if(d>0)return 'Corti s’est dégonflé de '+d+'. Qu’est-ce qui a le mieux marché ?';if(d===0)return 'Même position. C’est normal : ces gestes demandent de l’entraînement. Reviens demain.';return 'Corti a regonflé. Ça arrive, et ce n’est pas un échec. Si ça dure, parles-en à un adulte.'}
function cardData(){var h=Object.keys(S.stick).filter(function(k){return S.stick[k]});return {a:h.length?h.join(' · '):'À choisir',b:S.k2||'À compléter',c:S.k3||'À compléter'}}
function renderCard(){var el=document.getElementById('card');if(!el)return;var c=cardData();el.innerHTML='<svg class="c" viewBox="0 0 200 130" aria-hidden="true">'+crabMini(0,0,1)+'</svg><h3>Ma boîte à calme</h3><dl><div><dt>Quand ça monte</dt><dd>'+esc(c.a)+'</dd></div><div><dt>Ma phrase</dt><dd>'+esc(c.b)+'</dd></div><div><dt>Je peux parler à</dt><dd>'+esc(c.c)+'</dd></div></dl>'}
var B={d:1,on:false,t:null,end:0},G={on:false,t:null};
function stopAll(){B.on=false;clearTimeout(B.t);G.on=false;clearTimeout(G.t)}
function breathe(i){if(!B.on)return;var b=document.getElementById('bubble'),x=document.getElementById('btxt');if(!b||!x){B.on=false;return}if(Date.now()>=B.end){B.on=false;b.style.transform='scale(.55)';x.textContent='Bravo !';document.getElementById('bstart').textContent='Lancer Corti';return}b.style.transform=i?'scale(1)':'scale(.55)';x.textContent=i?'Inspire':'Souffle';B.t=setTimeout(function(){breathe(!i)},5000)}
var GS=[['Serre fort tes poings',5],['Relâche',7],['Monte tes épaules vers tes oreilles',5],['Relâche',7],['Plisse ton visage',5],['Relâche tout',7]];
function guide(i){if(!G.on)return;var g=document.getElementById('guide');if(!g){G.on=false;return}if(i>=GS.length){G.on=false;g.textContent='Bravo ! Tu sens la différence ?';document.getElementById('gstart').textContent='Recommencer';return}g.textContent=GS[i][0]+'…';G.t=setTimeout(function(){guide(i+1)},GS[i][1]*1000)}
function render(){stopAll();var id=(location.hash||'').slice(1);if(VIEWS[id]){app.innerHTML=VIEWS[id]();renderCard()}else home();window.scrollTo(0,0)}
function go(id){if(!id&&!location.hash){render();return}if('#'+id===location.hash){render();return}location.hash=id;if(!id)render()}
window.addEventListener('hashchange',render);
document.addEventListener('click',function(ev){var t=ev.target.closest('button');if(!t)return;var d=t.dataset;
 if(t.hasAttribute('data-go')){go(d.go);return}
 if(t.hasAttribute('data-help')||t.id==='helpbtn'){var h=document.getElementById('aide');if(h)h.scrollIntoView({behavior:'smooth'});else{location.hash='';render();setTimeout(function(){var a=document.getElementById('aide');if(a)a.scrollIntoView()},60)}return}
 if(d.quiz){var id=d.quiz,i=+d.i,j=+d.j,it=cur(id);S.game[id]=S.game[id]||{};S.game[id][i]=j;save();var q=t.closest('.q');q.querySelectorAll('.choice').forEach(function(b,k){b.disabled=true;if(k===it[i].a)b.classList.add('ok');else if(k===j)b.classList.add('ko')});q.querySelector('.fb').innerHTML=(j===it[i].a?'<b>Bien vu !</b> ':'<b>Pas tout à fait.</b> ')+it[i].e;document.getElementById('score-'+id).textContent=score(id,it);if(id==='q2')document.getElementById('piles').innerHTML=piles();return}
 if(d.reset){nextRound(d.reset);delete S.game[d.reset];save();var y=window.scrollY;render();window.scrollTo(0,y);return}
 if(d.finish!=null){var n=+d.finish;S.done[STEPS[n].id]=true;save();go(STEPS[n+1]?STEPS[n+1].id:'');return}
 if(d.body){S.seen[d.body]=1;save();document.querySelectorAll('.hot').forEach(function(b){b.setAttribute('aria-pressed',b===t?'true':'false')});t.classList.add('seen');document.getElementById('body-txt').innerHTML=bodyView(d.body);return}
 if(d.pick){S.picks[d.pick]=!S.picks[d.pick];save();t.setAttribute('aria-pressed',S.picks[d.pick]?'true':'false');document.getElementById('tips').innerHTML=tips();return}
 if(d.stick){S.stick[d.stick]=!S.stick[d.stick];save();t.setAttribute('aria-pressed',S.stick[d.stick]?'true':'false');renderCard();return}
 if(d.dur){B.d=+d.dur;document.querySelectorAll('[data-dur]').forEach(function(b){b.setAttribute('aria-pressed',b===t?'true':'false')});return}
 if(t.hasAttribute('data-sense')){t.classList.toggle('on');return}
 if(t.id==='bstart'){if(B.on){B.on=false;clearTimeout(B.t);document.getElementById('bubble').style.transform='scale(.55)';document.getElementById('btxt').textContent='Prêt ?';t.textContent='Lancer Corti';return}B.on=true;B.end=Date.now()+B.d*60000;t.textContent='Arrêter';breathe(true);return}
 if(t.id==='gstart'){clearTimeout(G.t);G.on=true;t.textContent='Recommencer';guide(0);return}
 if(t.id==='copy'){var c=cardData(),o=document.getElementById('copied'),f=function(){o.textContent='La copie ne marche pas ici. Sélectionne le texte à la main.'};try{navigator.clipboard.writeText('Ma boîte à calme\nQuand ça monte : '+c.a+'\nMa phrase : '+c.b+'\nJe peux parler à : '+c.c).then(function(){o.textContent='Carte copiée.'},f)}catch(e){f()}}
});
document.addEventListener('input',function(ev){var t=ev.target;if(t.id==='mine'){S.mine=t.value;save()}if(t.id==='k2'||t.id==='k3'){S[t.id]=t.value;save();renderCard()}if(t.id==='s-after'){S.after=+t.value;save();document.getElementById('v-after').textContent=S.after+' / 10';document.getElementById('box-after').innerHTML=crabSVG(S.after);document.getElementById('compare').textContent=compare()}});
render();
})();
</script>
</body>
</html>
